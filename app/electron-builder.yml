# Packaging (AGENTS.md → Environments & Release). Signing is opt-in via CI
# secrets (see .github/workflows/release.yml): without them the installers are
# unsigned and the Gatekeeper/SmartScreen workarounds in the README apply.
appId: io.github.xxpasixx.pam-osc
productName: pam-osc
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  output: release
files:
  - out/**
# Bundled device definitions & default mappings ship next to the app code;
# the main process resolves them via process.resourcesPath when packaged.
extraResources:
  - from: ../resources
    to: resources
  # PAM-9: the MA3 plugin + OSC config the setup assistant installs into local onPC folders
  - from: ../gma3_library/datapools/plugins
    to: resources/plugin
  - from: ../gma3_library/inout/osc
    to: resources/osc
# CI uploads into a DRAFT GitHub release — the maintainer reviews and publishes it.
publish:
  provider: github
  owner: xxpasixx
  repo: pam-osc
  releaseType: draft
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.music
  icon: build/icon-mac.png
  hardenedRuntime: true
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon-win.png
linux:
  # Derived default would be "@pam-oscapp" (from the scoped package name) —
  # the "@" is rejected as a file path.
  executableName: pam-osc
  syncDesktopName: true
  target:
    - target: AppImage
      arch: [x64]
  category: Audio
  icon: build/icon-linux.png
