name: CI

# Read-only checks on every push/PR to v2: plugin XML in sync with the Lua
# sources, typecheck, tests. Replaces the v1 "MA3 Plugin Build" workflow
# (pull_request_target + write token on PR code, and it stamped v1 versions
# into the plugin XML). On v2 the XML is generated by app/scripts/build-plugin-xml.mjs.

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]

permissions:
  contents: read

jobs:
  check:
    # Virtual MIDI ports for the integration tests work on macOS runners.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Plugin XML matches the Lua sources
        run: |
          npm run build:plugin
          git diff --exit-code -- ../gma3_library/datapools/plugins/pam-osc.xml \
            || { echo "::error::pam-osc.xml is stale — run 'npm run build:plugin' in app/ and commit"; exit 1; }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
